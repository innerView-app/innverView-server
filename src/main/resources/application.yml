server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
      url: jdbc:h2:mem:testdb
      username: sa
      password: password
      driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${host}:${port}/${database}
    username: ${username}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver