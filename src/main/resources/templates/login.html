<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<style>
    body{font-family:Arial, sans-serif;background:#f5f5f5;margin:0;padding:40px;display:flex;justify-content:center;}
    .box{background:#fff;padding:40px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);width:320px;text-align:center;}
    form{display:flex;flex-direction:column;margin-bottom:20px;}
    input{margin-bottom:10px;padding:8px;border:1px solid #ccc;border-radius:4px;}
    button{padding:8px;border:none;border-radius:4px;background:#4CAF50;color:#fff;cursor:pointer;}
    button:hover{background:#45a049;}
    .oauth{margin-top:10px;}
</style>
<div class="box">
    <h1>로그인</h1>
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>
    <div class="oauth">
        <a th:href="${loginUrl}">
            <img src="/kakao_login_medium_narrow.png" alt="Kakao Login" />
        </a>
    </div>
    <a href="/signup">회원가입</a>
</div>
</body>
</html>
