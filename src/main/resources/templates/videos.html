<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Videos</title>
</head>
<body>
<style>
    body{font-family:Arial, sans-serif;background:#f5f5f5;margin:0;padding:40px;text-align:center;}
    #feed{display:flex;flex-direction:column;gap:20px;}
    video{max-width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
</style>
<h1>Short Videos</h1>
<div id="feed"></div>
<script>
fetch('/api/shorts')
  .then(res => res.json())
  .then(list => {
    const feed = document.getElementById('feed');
    list.forEach(c => {
      const video = document.createElement('video');
      video.src = `/api/projects/${c.project.id}/final/hls/${c.id}/index.m3u8`;
      video.controls = true;
      feed.appendChild(video);
    });
  });
</script>
</body>
</html>
