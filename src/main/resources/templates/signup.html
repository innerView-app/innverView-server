<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <script>
        async function handleSubmit(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                alert("Registration successful!");
                window.location.href = "/"; // 원하는 페이지로 이동
            } else {
                const error = await response.json();
                alert(`Error: ${error.detail || response.statusText}`);
            }
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .box { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        form { display: flex; flex-direction: column; }
        input { margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px; border: none; border-radius: 4px; background: #4CAF50; color: #fff; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
<div class="box">
    <h1>Register</h1>
    <form onsubmit="handleSubmit(event)">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
    </form>
</div>
</body>
</html>
